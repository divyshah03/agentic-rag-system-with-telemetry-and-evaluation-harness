[project]
name = "ragproductionapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divy Shah", email = "divyrshah3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.4.2",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.24",
    "llama-index-readers-file>=0.6.0",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# The importable package is `app/` at the repo root rather than the default `src/<project-name>/`.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
]
